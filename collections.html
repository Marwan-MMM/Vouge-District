<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections — Vogue District</title>
  <meta name="description" content="Explore the Vogue District collections — curated edits of coats, knits, evening pieces and everyday essentials, plus new arrivals, best sellers and sale.">
  <!-- SOCIAL SHARING — replace example URLs with the real domain before going live -->
  <meta property="og:title" content="Collections — Vogue District">
  <meta property="og:description" content="Curated edits for the season — Autumn Layers, Evening Edit and Everyday Essentials, plus new arrivals, best sellers and sale.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/editorial/campaign-1.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="collections">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">

    <!-- ================================================================
         PAGE HERO
         ================================================================ -->
    <section class="page-hero" aria-labelledby="collections-hero-title">
      <div class="container">
        <p class="page-hero__crumbs">
          <a href="index.html">Home</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Collections</span>
        </p>
        <h1 id="collections-hero-title" class="page-hero__title">Collections</h1>
        <p class="page-hero__subtitle">Small, deliberate edits — a few pieces that work
          hard together, chosen for fabric first and fuss last.</p>
      </div>
    </section>

    <!-- ================================================================
         COLLECTIONS GRID — rendered by collections.js
         Curated collections come from the data layer (VD.api.getCollections);
         three shortcut cards (New arrivals / Best sellers / Sale) are always
         appended. While loading, three cream placeholder cards are shown.
         ================================================================ -->
    <section class="section" aria-labelledby="collections-grid-title">
      <div class="container">
        <div class="section__head">
          <div>
            <p class="eyebrow">Curated for you</p>
            <h2 id="collections-grid-title" class="section__title">Shop the edits</h2>
          </div>
          <a class="text-link" href="shop.html">View all products<span aria-hidden="true"> →</span></a>
        </div>

        <div class="collections-grid" id="collections-grid" aria-live="polite">
          <!-- Loading skeletons — replaced by collections.js once data arrives -->
          <div class="collection-card" style="background: var(--color-cream); aspect-ratio: 4 / 5;" aria-hidden="true"></div>
          <div class="collection-card" style="background: var(--color-cream); aspect-ratio: 4 / 5;" aria-hidden="true"></div>
          <div class="collection-card" style="background: var(--color-cream); aspect-ratio: 4 / 5;" aria-hidden="true"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <!-- Shared scripts (order matters) -->
  <script src="config.js" defer></script>
  <script src="demo-data.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="supabase.js" defer></script>
  <script src="products.js" defer></script>
  <script src="cart.js" defer></script>
  <script src="wishlist.js" defer></script>
  <script src="main.js" defer></script>
  <script src="collections.js" defer></script>
</body>
</html>
