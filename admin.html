<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store admin — Vogue District</title>
  <meta name="description" content="Admin panel — manage products, orders and demo data.">
  <!-- The admin panel is private — keep it out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

  <!--
    ADMIN PANEL — self-managed chrome.
    Unlike the storefront pages there is intentionally NO #site-header /
    #site-footer placeholder here: main.js skips its chrome injection when
    they are missing, and admin.js renders its own topbar, tabs and views
    into #admin-root (setup guide → login → admin panel).
  -->
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="admin-root"></div>

  <!-- Shared scripts (order matters) — the page script is admin.js -->
  <script src="config.js" defer></script>
  <script src="demo-data.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="supabase.js" defer></script>
  <script src="products.js" defer></script>
  <script src="cart.js" defer></script>
  <script src="wishlist.js" defer></script>
  <script src="main.js" defer></script>
  <script src="admin.js" defer></script>
</body>
</html>
